    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>层叠与继承+盒模型</title>
        <link rel="stylesheet" href="./stack.css">
    </head>
    <body>
        <!-- div.container回车 -->
        <div class="ssc_container">
            <h2 class="ssc_container_title">层叠与继承+盒模型</h2>
            <div class="ssc_card_wrap" id="ssc_card_wrap">
                <div class="ssc_card">
                    <img src="./img/2.jpg" alt="">
                    <h3>盒模型</h3>
                    <p class="ssc_card_desc">盒模型:是指每个元素都可以看作一个矩形盒子，盒子由内容(content)、内边距(padding)、边框(border)和外边距(margin)组成。</p>
                </div>
            </div>
            <!-- ol>li*10回车 -->
            <!-- 通关游戏答案 -->
            <h2>通关游戏答案</h2>
            <ol>
                <li>plate</li>
                <li>bento</li>
                <li>#fancy</li>
                <li>plate apple</li>
                <li>#fancy pickle</li>
                <li>.small</li>
                <li>orange.small</li>
                <li>bento orange.small</li>
                <li>plate,bento</li>
                <li>*</li>
            </ol>
        </div>
    </body>
    </html>
